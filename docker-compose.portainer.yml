# Lagerverwaltung - Portainer/NAS Stack
# Verwendet fertige Images von ghcr.io - kein lokales Bauen noetig.
# In Portainer: "Compose path" auf diese Datei setzen.
#
# WICHTIG: Alle Daten liegen in benannten Docker-Volumes mit FESTEM Namen
# (nicht Portainer/Stack-generiert). Das macht Backup/Reset eindeutig und
# unabhaengig davon, wie der Stack in Portainer heisst oder von wo Portainer
# das Git-Repo gerade ausgecheckt hat (wichtig bei GitOps-Redeploys!).

services:
  mysql:
    image: mysql:8.3
    container_name: lagerverwaltung-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --authentication-policy=caching_sha2_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lagerverwaltung}
      MYSQL_USER: ${MYSQL_USER:-lagerverwaltung}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - lagerverwaltung

  backend:
    image: ghcr.io/sirbuschi2003/lagerverwaltung-backend:latest
    container_name: lagerverwaltung-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-lagerverwaltung}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE:-lagerverwaltung}
      DB_SYNCHRONIZE: false
      DB_MIGRATIONS_RUN: true
      JWT_SECRET: ${BACKEND_JWT_SECRET}
      JWT_EXPIRES_IN: ${BACKEND_JWT_EXPIRES_IN:-8h}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_DISPLAY_NAME: ${DEFAULT_ADMIN_DISPLAY_NAME:-System Administrator}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-80}
      INVENTORY_HMAC_SECRET: ${INVENTORY_HMAC_SECRET}
      PURCHASE_ORDER_STORAGE_PATH: /app/purchase-orders
    volumes:
      - backend_backups:/app/backups
      - backend_purchase_orders:/app/purchase-orders
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - lagerverwaltung

  frontend:
    image: ghcr.io/sirbuschi2003/lagerverwaltung-frontend:latest
    container_name: lagerverwaltung-ui
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - lagerverwaltung

networks:
  lagerverwaltung:
    driver: bridge

# Feste Volume-Namen - unabhaengig vom Stack-/Projektnamen in Portainer.
# Backup/Reset ist damit immer eindeutig: "lagerverwaltung_*" in Portainer
# unter Volumes suchen, nicht raten muessen welches gemeint ist.
volumes:
  mysql_data:
    name: lagerverwaltung_mysql_data
    driver: local
  backend_backups:
    name: lagerverwaltung_backups
    driver: local
  backend_purchase_orders:
    name: lagerverwaltung_purchase_orders
    driver: local
