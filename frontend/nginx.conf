server {
  listen 80;
  server_name _;
  charset utf-8;

  root /usr/share/nginx/html;
  index index.html;

  # UTF-8 Encoding für alle Text-Dateien
  charset_types text/html text/css text/plain text/javascript application/javascript application/json application/xml;
  
  # Sicherstellen dass HTML immer mit UTF-8 ausgeliefert wird
  location ~ \.html$ {
    add_header Content-Type "text/html; charset=utf-8";
  }
  
  location ~ \.js$ {
    add_header Content-Type "application/javascript; charset=utf-8";
  }
  
  location ~ \.css$ {
    add_header Content-Type "text/css; charset=utf-8";
  }

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}


