name: Docker Build & Push to GHCR

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase owner name
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Read version from package.json
        run: echo "APP_VERSION=$(jq -r '.version' frontend/package.json)" >> $GITHUB_ENV

      - name: Create or update git tag for this version
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -f "v${{ env.APP_VERSION }}"
          git push origin "v${{ env.APP_VERSION }}" --force
        continue-on-error: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: runner
          push: true
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
          tags: |
            ghcr.io/${{ env.OWNER }}/lagerverwaltung-backend:latest
            ghcr.io/${{ env.OWNER }}/lagerverwaltung-backend:${{ env.APP_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/lagerverwaltung-frontend:latest
            ghcr.io/${{ env.OWNER }}/lagerverwaltung-frontend:${{ env.APP_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
