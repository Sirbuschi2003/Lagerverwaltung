name: lagerverwaltung

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Erlaubte API-Endpunkte (Principle of Least Privilege – NIS2-002)
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
      NETWORKS: 0
      VOLUMES: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EXEC: 0
      GRPC: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
    networks:
      - socket_proxy_net
    security_opt:
      - no-new-privileges:true

  mysql:
    image: mysql:8.3
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --authentication-policy=caching_sha2_password
      # Performance-Tuning für 200K+ Artikel / 200 gleichzeitige User
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-512M}
      - --innodb-log-file-size=256M
      - --innodb-flush-log-at-trx-commit=2
      - --innodb-io-capacity=1000
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-200}
      - --max-allowed-packet=64M
      - --tmp-table-size=64M
      - --max-heap-table-size=64M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - lagerverwaltung
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 2G

  backend:
    image: ghcr.io/sirbuschi2003/lagerverwaltung-backend:latest
    build:
      context: ./backend
      target: runner
    restart: unless-stopped
    read_only: false
    depends_on:
      mysql:
        condition: service_healthy
      socket-proxy:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      DB_SYNCHRONIZE: false
      DB_MIGRATIONS_RUN: true
      JWT_SECRET: ${BACKEND_JWT_SECRET}
      JWT_EXPIRES_IN: ${BACKEND_JWT_EXPIRES_IN:-8h}
      JWT_REFRESH_EXPIRES_IN: ${BACKEND_JWT_REFRESH_EXPIRES_IN:-90d}
      INVENTORY_HMAC_SECRET: ${INVENTORY_HMAC_SECRET}
      ALLOWED_ORIGINS: "http://${APP_HOST:-localhost},https://${APP_HOST:-localhost}"
      # Update-Funktion: Projekt- und Compose-Datei-Pfad fuer docker compose pull/up
      COMPOSE_PROJECT_NAME: lagerverwaltung
      COMPOSE_FILE_PATH: /workspace/docker-compose.main.yml
      BACKEND_IMAGE: ghcr.io/sirbuschi2003/lagerverwaltung-backend:latest
      # HOST_PROJECT_PATH: Pfad auf dem HOST-System (Fallback falls Docker-Label-Erkennung fehlschlägt)
      # Wird normalerweise automatisch via "com.docker.compose.project.working_dir" Label erkannt.
      HOST_PROJECT_PATH: ${HOST_PROJECT_PATH:-}
      ITEM_IMAGE_PATH: /app/item-images
      LOG_ARCHIVE_PATH: /app/log-archives
      DELIVERY_NOTES_STORAGE_PATH: /app/delivery-notes
      DB_POOL_SIZE: ${DB_POOL_SIZE:-80}
      # NIS2-002: Docker-Zugriff ueber Socket-Proxy (kein direkter Socket-Mount mehr)
      DOCKER_HOST: tcp://socket-proxy:2375
    volumes:
      - ${BACKUP_STORAGE_HOST_PATH:-backups_data}:/app/backups
      - ${PURCHASE_ORDER_STORAGE_HOST_PATH:-purchase_orders_data}:/app/purchase-orders
      - ${ITEM_IMAGE_STORAGE_HOST_PATH:-item_images_data}:/app/item-images
      - ${LOG_ARCHIVE_STORAGE_HOST_PATH:-log_archives_data}:/app/log-archives
      - ${DELIVERY_NOTES_STORAGE_HOST_PATH:-delivery_notes_data}:/app/delivery-notes
      # Compose-Datei fuer Update-Skript einbinden
      - .:/workspace:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    # Security: non-root user, minimale Capabilities (NIS2-002: group_add entfernt, kein Socket-Mount mehr)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1536M
    networks:
      lagerverwaltung:
        aliases:
          - lager-backend
      socket_proxy_net:

  frontend:
    image: ghcr.io/sirbuschi2003/lagerverwaltung-frontend:latest
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      lagerverwaltung:
        aliases:
          - lager-frontend

  caddy:
    image: caddy:2.7
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    environment:
      APP_HOST: ${APP_HOST:-localhost}
    volumes:
      - ./deploy/caddy/Caddyfile.main:/etc/caddy/Caddyfile:ro
      - ./deploy/caddy:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      lagerverwaltung:
      lan02:
        ipv4_address: ${APP_HOST:-192.168.3.15}

networks:
  lagerverwaltung:
    driver: bridge
  # Isoliertes internes Netz fuer Socket-Proxy (NIS2-002: kein Outbound-Internet, nur Backend-Zugriff)
  socket_proxy_net:
    driver: bridge
    internal: true
  lan02:
    external: true
    name: LAN02

volumes:
  mysql_data:
  backups_data:
  purchase_orders_data:
  item_images_data:
  log_archives_data:
  delivery_notes_data:
  caddy_data:
  caddy_config:
